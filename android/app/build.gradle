apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
def disableGoogleServicesPlugin = (
    findProperty("app.disableGoogleServices") ?:
    System.getenv("APP_DISABLE_GOOGLE_SERVICES") ?:
    "false"
).toString().toBoolean()
if (!disableGoogleServicesPlugin) {
    apply plugin: "com.google.gms.google-services"
}

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()
def baseApplicationId = (findProperty("app.baseApplicationId") ?: "com.mohonfinderph.app").toString().trim()
def rawAppVariant = (
    System.getenv("APP_VARIANT") ?:
    System.getenv("EXPO_PUBLIC_APP_VARIANT") ?:
    ""
).toString().trim().toLowerCase()
def normalizedAppVariant = (rawAppVariant == "mf-sa" || rawAppVariant == "mfsa") ? "standalone" : rawAppVariant
def resolvedAppVariant = ["subscriber", "free", "owner", "dev", "dual", "standalone"].contains(normalizedAppVariant)
    ? normalizedAppVariant
    : "subscriber"
def freeVariantApplicationId = (findProperty("app.freeApplicationId") ?: System.getenv("FREE_VARIANT_ANDROID_PACKAGE") ?: "mffm.newvariant").toString().trim()
def resolvedApplicationId = resolvedAppVariant == "owner"
    ? "${baseApplicationId}.owner"
    : resolvedAppVariant == "free"
        ? (freeVariantApplicationId ?: "mffm.newvariant")
    : resolvedAppVariant == "dual"
        ? "${baseApplicationId}.dual"
        : resolvedAppVariant == "dev"
            ? "${baseApplicationId}.dev"
            : resolvedAppVariant == "standalone"
                ? "${baseApplicationId}.mfsa"
                : baseApplicationId
def defaultAppName = resolvedAppVariant == "owner"
    ? "MF-Owner"
    : resolvedAppVariant == "free"
        ? "MF-Free"
    : resolvedAppVariant == "dual"
        ? "MF-Dual"
        : resolvedAppVariant == "dev"
            ? "MF-Dev"
            : resolvedAppVariant == "standalone"
                ? "MF-SA"
                : "Mohon Finder"
def overrideAppName = (findProperty("app.overrideName") ?: "").toString().trim()
def resolvedAppName = overrideAppName ?: defaultAppName
def readSecret = { String... keys ->
    for (String key : keys) {
        def fromProperty = findProperty(key)
        if (fromProperty != null && fromProperty.toString().trim()) {
            return fromProperty.toString().trim()
        }
        def fromEnv = System.getenv(key)
        if (fromEnv != null && fromEnv.toString().trim()) {
            return fromEnv.toString().trim()
        }
    }
    return ""
}
def resolvedAdmobAppId = readSecret('EXPO_PUBLIC_ADMOB_APP_ID_ANDROID', 'ADMOB_APP_ID_ANDROID')
if (!resolvedAdmobAppId) {
    resolvedAdmobAppId = "ca-app-pub-3940256099942544~3347511713"
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/sdks/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    enableBundleCompression = (findProperty('android.enableBundleCompression') ?: false).toBoolean()
    // Use Expo CLI to bundle the app, this ensures the Metro config
    // works correctly with Expo projects.
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"

    /* Folders */
     //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true in release builds to optimize the app using [R8](https://developer.android.com/topic/performance/app-optimization/enable-app-optimization).
 */
def enableMinifyInReleaseBuilds = (
    findProperty('android.enableMinifyInReleaseBuilds') ?:
    System.getenv('ANDROID_ENABLE_MINIFY_IN_RELEASE_BUILDS') ?:
    'true'
).toString().toBoolean()
def enableShrinkResourcesInReleaseBuilds = (
    findProperty('android.enableShrinkResourcesInReleaseBuilds') ?:
    System.getenv('ANDROID_ENABLE_SHRINK_RESOURCES_IN_RELEASE_BUILDS') ?:
    'true'
).toString().toBoolean()
def allowInsecureReleaseSigning = (
    findProperty('app.allowInsecureReleaseSigning') ?:
    System.getenv('APP_ALLOW_INSECURE_RELEASE_SIGNING') ?:
    'false'
).toString().toBoolean()
def requestedTaskNames = gradle.startParameter.taskNames.collect { (it ?: '').toLowerCase() }
def isReleaseTaskRequested = requestedTaskNames.any { it.contains('release') }
def resolvedVersionName = (findProperty('app.versionName') ?: System.getenv('MFPH_VERSION_NAME') ?: '1.0.2').toString().trim()
def resolvedVersionCode = 2
try {
    resolvedVersionCode = Integer.parseInt(
        (findProperty('app.versionCode') ?: System.getenv('MFPH_VERSION_CODE') ?: '2').toString().trim()
    )
} catch (Exception ignored) {
    resolvedVersionCode = 2
}

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.mohonfinderph.app'
    defaultConfig {
        applicationId resolvedApplicationId
        resValue "string", "app_name", resolvedAppName
        manifestPlaceholders = [
            ADMOB_APP_ID: resolvedAdmobAppId
        ]
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode
        versionName resolvedVersionName

        buildConfigField "String", "REACT_NATIVE_RELEASE_LEVEL", "\"${findProperty('reactNativeReleaseLevel') ?: 'stable'}\""
        buildConfigField "String", "APP_VARIANT", "\"${resolvedAppVariant}\""
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            def storeFilePath = readSecret('MFPH_UPLOAD_STORE_FILE', 'MYAPP_UPLOAD_STORE_FILE', 'RELEASE_STORE_FILE')
            def storePasswordValue = readSecret('MFPH_UPLOAD_STORE_PASSWORD', 'MYAPP_UPLOAD_STORE_PASSWORD', 'RELEASE_STORE_PASSWORD')
            def keyAliasValue = readSecret('MFPH_UPLOAD_KEY_ALIAS', 'MYAPP_UPLOAD_KEY_ALIAS', 'RELEASE_KEY_ALIAS')
            def keyPasswordValue = readSecret('MFPH_UPLOAD_KEY_PASSWORD', 'MYAPP_UPLOAD_KEY_PASSWORD', 'RELEASE_KEY_PASSWORD')
            if (storeFilePath && storePasswordValue && keyAliasValue && keyPasswordValue) {
                def resolvedStoreFile = file(storeFilePath)
                if (!resolvedStoreFile.exists()) {
                    resolvedStoreFile = new File(projectRoot, storeFilePath)
                }
                storeFile resolvedStoreFile
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Prefer release keystore. Debug-signed release builds are blocked unless explicitly allowed.
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            } else if (allowInsecureReleaseSigning) {
                signingConfig signingConfigs.debug
                println('WARNING: app.allowInsecureReleaseSigning=true. APK is debug-signed and NOT secure for distribution.')
            } else if (!isReleaseTaskRequested) {
                // Allow non-release task graph evaluation (e.g., assembleDebug/IDE sync) without secure keystore secrets.
                signingConfig signingConfigs.debug
            } else {
                throw new GradleException(
                    'Release keystore is not configured. Configure MFPH_UPLOAD_* secrets before building secure release APK.'
                )
            }
            shrinkResources enableShrinkResourcesInReleaseBuilds
            minifyEnabled enableMinifyInReleaseBuilds
            debuggable false
            jniDebuggable false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            def enablePngCrunchInRelease = findProperty('android.enablePngCrunchInReleaseBuilds') ?: 'true'
            crunchPngs enablePngCrunchInRelease.toBoolean()
        }
    }
    packagingOptions {
        jniLibs {
            def enableLegacyPackaging = findProperty('expo.useLegacyPackaging') ?: 'false'
            useLegacyPackaging enableLegacyPackaging.toBoolean()
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

def fixReactNativeEntryPointBuildConfigPackage = {
    def entryPointFile = file("$buildDir/generated/autolinking/src/main/java/com/facebook/react/ReactNativeApplicationEntryPoint.java")
    if (!entryPointFile.exists()) {
        return
    }

    def expectedBuildConfigPrefix = "${android.namespace}.BuildConfig"
    def knownStalePrefixes = [
        "com.mohonfinderph.app.BuildConfig",
        "com.mohonfinderph.app.owner.BuildConfig",
        "com.mohonfinderph.app.dual.BuildConfig",
        "com.mohonfinderph.app.dev.BuildConfig",
        "com.mohonfinderph.app.mfsa.BuildConfig",
        "${android.defaultConfig.applicationId}.BuildConfig"
    ].unique()
    def fileContents = entryPointFile.getText("UTF-8")

    if (!fileContents.contains(expectedBuildConfigPrefix)) {
        def nextContents = fileContents
        knownStalePrefixes.each { stalePrefix ->
            if (nextContents.contains(stalePrefix)) {
                nextContents = nextContents.replace(stalePrefix, expectedBuildConfigPrefix)
            }
        }
        // Extra safety: rewrite any stale variant BuildConfig package
        // (e.g. com.mohonfinderph.app.mfsa.BuildConfig) to current namespace BuildConfig.
        nextContents = nextContents.replaceAll(
            /com\.mohonfinderph\.app(?:\.[A-Za-z0-9_]+)?\.BuildConfig/,
            java.util.regex.Matcher.quoteReplacement(expectedBuildConfigPrefix)
        )
        if (nextContents != fileContents) {
            entryPointFile.write(nextContents, "UTF-8")
            println("Patched ReactNativeApplicationEntryPoint BuildConfig package to ${expectedBuildConfigPrefix}")
        }
    }
}

tasks.matching { it.name == "generateAutolinkingPackageList" }.configureEach {
    doLast {
        fixReactNativeEntryPointBuildConfigPackage()
    }
}

tasks.matching {
    it.name == "compileDebugJavaWithJavac" || it.name == "compileReleaseJavaWithJavac"
}.configureEach {
    doFirst {
        fixReactNativeEntryPointBuildConfigPackage()
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation(platform("com.google.firebase:firebase-bom:34.1.0"))
    implementation("com.google.firebase:firebase-auth")
    implementation("com.google.firebase:firebase-firestore")

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        // For animated gif support
        implementation("com.facebook.fresco:animated-gif:${expoLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        // For webp support
        implementation("com.facebook.fresco:webpsupport:${expoLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            // Animated webp support
            implementation("com.facebook.fresco:animated-webp:${expoLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
